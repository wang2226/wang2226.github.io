<!DOCTYPE html>
<html>
  <title>Christmas 2022 Ski Trip</title>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      nav {
        font-size: 20px;
        background-color: grey;
        color: #cccccc;
        height: 75px;
      }

      ul {
        position: fixed;
        right: 10px;
      }

      ul li {
        display: inline;
        padding-right: 30px;
        font-weight: 500;
        color: rgb(251, 255, 0);
      }

      .blog {
        margin-top: 20px;
        width: 75%;
        margin-left: auto;
        margin-right: auto;
        height: 400px;
        font-size: 18px;
      }

      .post {
        margin-top: 20px;
        float: left;
      }

      .blogHeader {
        font-size: 36px;
        margin-bottom: 20px;
      }

      .links {
        float: right;
      }

      .links li {
        color: black;
      }

      .center {
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 50%;
      }

      footer {
        color: white;
        position: fixed;
        width: 100%;
        bottom: 0;
        margin-left: auto;
        margin-right: auto;
        font-size: 30px;
        height: 100px;
        padding: 20px;
        background-color: grey;
        text-align: center;
      }
    </style>
  </head>

  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-LCVSV9GF0S"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "G-LCVSV9GF0S");
  </script>

  <body>
    <div class="blog">
      <div class="post">
        <div class="center">
          <h1 style="text-align: center">Christmas 2022 Ski Trip</h1>
        </div>
        <div class="blog-body">
          <center>
            <p style="width: 900px; text-align: left">
              This was my first ski trip that began with a flight instead of a
              drive. I returned to two of my favorite ski resorts in the U.S.,
              Alta and Snowbird, and was lucky enough to enjoy some early-season
              powder along with Utah's seemingly endless sunshine.
            </p>
          </center>

          <figure>
            <img src="./images/christmas/gear.jpeg" class="center" />
            <figcaption align="center">
              Packing for the trip made me nostalgic. I miss living out West,
              where a ski resort was just a drive away.
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/subie1.JPG" class="center" />
            <figcaption align="center">
              I picked up the car for the trip. Its 2.4-liter turbocharged
              flat-four engine was smooth and impressively powerful.
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/subie2.jpeg" class="center" />
            <figcaption align="center">
              Heading straight to Brighton after landing!
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/tour.jpeg" class="center" />
            <figcaption align="center">A morning ski tour.</figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/tour_selfie.jpeg" class="center" />
            <figcaption align="center">
              A beautiful morning in Little Cottonwood Canyon.
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/bird.jpeg" class="center" />
            <figcaption align="center">
              The view from Snowbird's summit.
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/mole.jpeg" class="center" />
            <figcaption align="center">
              I enjoyed authentic pollo en mole at Red Iguana. I highly
              recommend this restaurant if you're ever in Salt Lake City!
            </figcaption>
          </figure>

          <figure>
            <img src="./images/christmas/rain.jpeg" class="center" />
            <figcaption align="center">
              Pouring rain at Snowbasin. I thought Utah was known for dry snow
              :P
            </figcaption>
          </figure>
        </div>
      </div>
    </div>
  </body>
</html>
